name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.RELEASE_TAG !== expected) throw new Error('Release tag must be ' + expected)"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and test
        run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish stable package
        if: ${{ !github.event.release.prerelease }}
        run: npm publish --access public

      - name: Publish prerelease package with next tag
        if: ${{ github.event.release.prerelease }}
        run: npm publish --access public --tag next
